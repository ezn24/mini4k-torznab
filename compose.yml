services:
  mini4k-torznab:
    image: ${MINI4K_IMAGE:-mini4k-torznab:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini4k-torznab
    restart: unless-stopped
    init: true
    environment:
      MINI4K_BASE_URL: ${MINI4K_BASE_URL:-https://www.mini4k.com}
      FETCH_MODE: flaresolverr
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      FLARESOLVERR_MAX_TIMEOUT: ${FLARESOLVERR_MAX_TIMEOUT:-180000}
      FLARESOLVERR_HTTP_TIMEOUT: ${FLARESOLVERR_HTTP_TIMEOUT:-210}
      FLARESOLVERR_SESSION_ID: ${FLARESOLVERR_SESSION_ID:-mini4k-torznab}
      FLARESOLVERR_SESSION_TTL_MINUTES: ${FLARESOLVERR_SESSION_TTL_MINUTES:-1440}
      BROWSER_LOCK_TIMEOUT: ${BROWSER_LOCK_TIMEOUT:-30}
      MINI4K_COOKIE_FILE: /data/mini4k-cookie.txt
      MINI4K_AUTO_LOGIN: ${MINI4K_AUTO_LOGIN:-true}
      MINI4K_CREDENTIALS_KEY: ${MINI4K_CREDENTIALS_KEY:-}
      MINI4K_CREDENTIALS_TOKEN: ${MINI4K_CREDENTIALS_TOKEN:-}
      API_KEY: ${API_KEY:?Copy .env.example to .env and set API_KEY}
      MAX_WORKS: ${MAX_WORKS:-1}
      MAX_RESULTS: ${MAX_RESULTS:-100}
      TEST_QUERY_MOVIE: ${TEST_QUERY_MOVIE:-沙丘}
      TEST_QUERY_TV: ${TEST_QUERY_TV:-怪奇物语}
    volumes:
      - ${DATA_PATH:-./data}:/data
    ports:
      - "${PUBLISHED_PORT:-8787}:8787"
    networks:
      - media

networks:
  media:
    external: true
    name: ${MEDIA_NETWORK:-jellyfin_default}

